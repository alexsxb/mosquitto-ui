listener 1883

# The log goes to docker logs, and as messages on $SYS/broker/log/<level> to the UI, for the page Logs. Debug lines never go
# there. Whoever may read $SYS/# gets them as well
log_dest stderr
log_dest topic

# What each client does and recordings of it, for the pages Sessions and Trace, and the message rules the UI writes to its
# file; first, so that it sees every ACL check (it never decides one) and every message. See docker/mosquitto/inspect/inspect.c
plugin /usr/lib/mosquitto_inspect.so
plugin_opt_rules_file /mosquitto/ui/rules/rules.json

# Login with an access token (JWT), set up on the page Token login; before dynamic security, which it leaves every other
# client to. Without its file it does nothing. See docker/mosquitto/token-auth/token_auth.c
plugin /usr/lib/mosquitto_token_auth.so
plugin_opt_config_file /mosquitto/ui/token-auth/token-auth.json

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# Retained messages and sessions, saved as they change (flushed every 5 seconds)
persistence_location /mosquitto/data
global_plugin /usr/lib/mosquitto_persist_sqlite.so

# Managed by the UI, should stay the last line
include_dir /mosquitto/ui/conf.d
