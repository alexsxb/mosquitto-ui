# Mosquitto of mosquitto-ui without Docker, as standalone/install.sh puts it in /etc/mosquitto-ui/mosquitto.conf; the same as
# docker/mosquitto/mosquitto.conf with the paths of the host. install.sh never overwrites this file once it is there.
# The broker starts as root under the agent (mosquitto-ui-broker.service) and then runs as the user mosquitto.
user mosquitto

listener 1883

# The log goes to the journal (journalctl -u mosquitto-ui-broker), and as messages on $SYS/broker/log/<level> to the UI, for
# the page Logs. Debug lines never go there. Whoever may read $SYS/# gets them as well
log_dest stderr
log_dest topic

# What each client does and recordings of it, for the pages Sessions and Trace, and the message rules the UI writes to its
# file; first, so that it sees every ACL check (it never decides one) and every message
plugin /usr/local/lib/mosquitto-ui/mosquitto_inspect.so
plugin_opt_rules_file /var/lib/mosquitto-ui/shared/rules/rules.json

# Login with an access token (JWT), set up on the page Token login; before dynamic security, which it leaves every other
# client to. Without its file it does nothing
plugin /usr/local/lib/mosquitto-ui/mosquitto_token_auth.so
plugin_opt_config_file /var/lib/mosquitto-ui/shared/token-auth/token-auth.json

plugin /usr/local/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /var/lib/mosquitto/dynamic-security.json

# Retained messages and sessions, saved as they change (flushed every 5 seconds)
persistence_location /var/lib/mosquitto
global_plugin /usr/local/lib/mosquitto_persist_sqlite.so

# Managed by the UI, should stay the last line
include_dir /var/lib/mosquitto-ui/shared/conf.d
