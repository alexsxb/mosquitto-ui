quarkus.application.name=mosquitto-ui

# ---------------------------------------------------------------------------
# Broker: the client of the dynamic security plugin. Needs the role dynsec-admin (MOSQUITTO_USERNAME, MOSQUITTO_PASSWORD)
# ---------------------------------------------------------------------------
mosquitto.host=localhost
mosquitto.port=1883
mosquitto.tls=false
mosquitto.timeout=PT5S
%dev.mosquitto.port=11883
%dev.mosquitto.username=admin
%dev.mosquitto.password=dev-dynsec-password

# Directory shared with docker/mosquitto/agent.sh in the broker container, for the configuration and restarts
mosquitto-ui.shared-dir=/mosquitto/ui
%dev.mosquitto-ui.shared-dir=docker/mosquitto/ui
# Data of this application: settings and account of the certificate
mosquitto-ui.state-dir=/var/lib/mosquitto-ui
%dev.mosquitto-ui.state-dir=docker/state
# The certificate as the broker sees it, for certfile and keyfile
mosquitto-ui.cert-dir=/mosquitto/data/certs
# mosquitto-ui.secret-key (MOSQUITTO_UI_SECRET_KEY) encrypts secrets in the state directory: openssl rand -base64 32
# Without it, a key is generated there once
# Where the page Backups looks up GPG keys of recipients
mosquitto-ui.backup.keyserver=https://keys.openpgp.org
# Local backup targets lie below this directory (the volume in deploy/compose.yaml), nowhere else in the container
mosquitto-ui.backup.local-root=/backups
%dev.mosquitto-ui.backup.local-root=${java.io.tmpdir}/mosquitto-ui-backups
%test.mosquitto-ui.backup.local-root=${java.io.tmpdir}/mosquitto-ui-backups
# The shared directory as the broker sees it
mosquitto-ui.broker-shared-dir=/mosquitto/ui
# How long the page Topics keeps reading after its last viewer left
mosquitto-ui.topics.idle-stop=PT60S
# Port of the GX device for pairing, and how often it is asked to keep publishing: it stops after 60 seconds
mosquitto-ui.victron.https-port=443
mosquitto-ui.victron.keepalive-interval=30s
# How often the UI looks who is connected, for the last connection of the clients
mosquitto-ui.client-logins.interval=15s
%test.mosquitto-ui.client-logins.interval=1s
# A client whose last connection lasted this long is expected back: the dashboard names it after it was gone for missing-after, for missing-for
mosquitto-ui.client-logins.steady-after=PT1H
mosquitto-ui.client-logins.missing-after=PT15M
mosquitto-ui.client-logins.missing-for=P7D
# How often the UI looks for outages, and how long the broker or a bridge has to be gone before a mail goes out
mosquitto-ui.notifications.interval=1m
mosquitto-ui.notifications.outage-after=PT5M
# A mail for this many rejected logins within the window; errors in the log and rejected logins at most once in log-mail-every
mosquitto-ui.notifications.rejected-logins=10
mosquitto-ui.notifications.rejected-window=PT10M
mosquitto-ui.notifications.log-mail-every=PT1H
%test.mosquitto-ui.notifications.interval=1s
%test.mosquitto-ui.notifications.outage-after=PT1S
# Token login: how often the file of the broker plugin is compared with dynamic security, and the keys of the identity
# providers fetched again (key-refresh)
mosquitto-ui.token-auth.interval=1m
mosquitto-ui.token-auth.key-refresh=PT15M
# How often the history of the dashboard gets a point, and how long it is kept
mosquitto-ui.broker-stats.interval=5m
%test.mosquitto-ui.broker-stats.interval=1s
mosquitto-ui.broker-stats.keep=P7D
# acme4j needs Bouncy Castle
quarkus.security.security-providers=BC
# How often the UI looks whether the certificate is due; after a start it waits for the delay first
mosquitto-ui.certificate.renewal-check=12h
mosquitto-ui.certificate.renewal-delay=5m
%test.mosquitto-ui.certificate.renewal-check=2s
%test.mosquitto-ui.certificate.renewal-delay=1s
# How long the broker may take to apply a configuration or to come back
mosquitto-ui.agent-timeout=PT30S
# Uploads of mosquitto.db
quarkus.http.limits.max-body-size=256M

# ---------------------------------------------------------------------------
# Login: identity providers are set up on the page Login (sso/SsoService) and do the code flow on /auth/sso/<id> only
# (sso/SsoTenantResolver); the OIDC extension has no tenant of its own (localauth/OidcDefaultTenantOff). The session is the
# encrypted cookie of this application (localauth/LocalSessions), for the local login as well.
# QUARKUS_OIDC_AUTH_SERVER_URL, QUARKUS_OIDC_CLIENT_ID and QUARKUS_OIDC_CREDENTIALS_SECRET of older versions become a provider at the
# first start, they are not read afterwards.
# ---------------------------------------------------------------------------
%dev.quarkus.oidc.auth-server-url=http://localhost:18181/realms/mosquitto-ui
%dev.quarkus.oidc.client-id=mosquitto-ui
%dev.quarkus.oidc.credentials.secret=dev-client-secret
quarkus.keycloak.devservices.enabled=false

# Dev: Keycloak and Mosquitto from docker compose (see docker/compose.yaml)
%dev.quarkus.compose.devservices.files=docker/compose.yaml
%dev.quarkus.compose.devservices.stop-services=false
%dev.quarkus.compose.devservices.remove-volumes=false
%dev.quarkus.compose.devservices.ryuk-enabled=false
%test.quarkus.compose.devservices.enabled=false
%prod.quarkus.compose.devservices.enabled=false

# MOSQUITTO_UI_AUTH=local keeps the local login on, whatever the page Login says: the way back in when nobody can log in at the
# provider any longer. The local login is on as well while no provider is on; its first user is created then, with
# MOSQUITTO_UI_LOCAL_AUTH_INITIAL_PASSWORD or a generated password in <state-dir>/initial-password
mosquitto-ui.auth=oidc
# The role of everybody who is let in (the page Login decides who is); MOSQUITTO_UI_ADMIN_ROLE was the role a provider had to give in
# older versions, it becomes the role the provider taken over from QUARKUS_OIDC_* asks for
mosquitto-ui.admin-role=mosquitto-admin
quarkus.http.auth.policy.admin.roles-allowed=${mosquitto-ui.admin-role}
quarkus.http.auth.permission.ui.paths=/*
quarkus.http.auth.permission.ui.policy=authenticated
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=admin
quarkus.http.auth.permission.me.paths=/api/auth/me
quarkus.http.auth.permission.me.policy=authenticated
quarkus.http.auth.permission.public.paths=/q/health,/q/health/*,/api/auth/mode,/api/auth/login,/api/auth/logout
quarkus.http.auth.permission.public.policy=permit
# The code flow of the identity providers, only there the OIDC extension has something to say
quarkus.http.auth.permission.sso.paths=/auth/sso/*
quarkus.http.auth.permission.sso.policy=authenticated
quarkus.http.auth.permission.sso.auth-mechanism=code
# The landing page: the frontend without data, which stays behind /api. Every other path sends visitors to the login
quarkus.http.auth.permission.landing.paths=/,/index.html,/assets/*,/favicon.svg,/theme.js,/manifest.json,/sw.js,/offline.html,/icons/*,/handbuch,/handbuch/*
quarkus.http.auth.permission.landing.policy=permit
# What the Vite dev server serves instead of /assets
%dev.quarkus.http.auth.permission.vite.paths=/src/*,/node_modules/*,/@vite/*,/@id/*,/@fs/*,/@react-refresh
%dev.quarkus.http.auth.permission.vite.policy=permit

# Behind a reverse proxy: redirect URIs from X-Forwarded-*, but only from trusted proxies
#quarkus.http.proxy.proxy-address-forwarding=true
#quarkus.http.proxy.allow-x-forwarded=true
#quarkus.http.proxy.trusted-proxies=10.0.0.0/8,127.0.0.1

# ---------------------------------------------------------------------------
# HTTP / API
# ---------------------------------------------------------------------------
# Next to pdnsadmin in dev mode
%dev.quarkus.http.port=8090
quarkus.smallrye-openapi.info-title=mosquitto-ui API
quarkus.smallrye-openapi.store-schema-directory=target/openapi
mp.openapi.extensions.smallrye.operationIdStrategy=METHOD

# Security headers on all responses. The Content-Security-Policy not in dev mode, where the Vite dev server needs
# inline scripts; styles inline for the components (e.g. toasts).
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."Referrer-Policy".value=strict-origin-when-cross-origin
security-headers.content-security-policy=default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'
%prod.quarkus.http.header."Content-Security-Policy".value=${security-headers.content-security-policy}
%test.quarkus.http.header."Content-Security-Policy".value=${security-headers.content-security-policy}

# Only what has a hash in its name may be cached. A stored /login would keep the button from reaching the login, and a
# stored index.html would keep an old version running after an update
quarkus.http.filter.no-store.matches=/(?!assets/).*
quarkus.http.filter.no-store.header."Cache-Control"=no-store

# ---------------------------------------------------------------------------
# Frontend (src/main/webui, Vite dev server in dev mode)
# ---------------------------------------------------------------------------
quarkus.quinoa.dev-server.port=5174
quarkus.quinoa.enable-spa-routing=true
quarkus.quinoa.ignored-path-prefixes=/api,/q
# Quinoa downloads its own Node/npm (into .quinoa), so the build does not depend on the PATH
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=26.12.1
# Stands in for the DNS tool in the certificate tests
%test.quarkus.http.auth.permission.fake-dns.paths=/fake-dns/*
%test.quarkus.http.auth.permission.fake-dns.policy=permit
# Tests do not need the frontend build
%test.quarkus.quinoa=false
